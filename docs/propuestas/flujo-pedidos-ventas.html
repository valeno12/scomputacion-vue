<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Propuesta · Pedidos y ventas · SC.EXE</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #141416;
        --panel: #222225;
        --inset: #19191c;
        --line: #3c3c42;
        --text: #f5f5f7;
        --muted: #b8b8c1;
        --blue: #8ab4ff;
        --bluebg: #222f47;
        --amber: #f7cd80;
        --amberbg: #382e20;
        --green: #87dfb2;
        --greenbg: #20392c;
        --purple: #d0b8ff;
        --purplebg: #30273f;
        --primary: #326bea;
        --shadow: 0 20px 80px #0005;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      body.light {
        color-scheme: light;
        --bg: #f6f6f8;
        --panel: #fff;
        --inset: #f1f2f5;
        --line: #d8dce5;
        --text: #202531;
        --muted: #596273;
        --blue: #225ac2;
        --bluebg: #eaf1ff;
        --amber: #8c5708;
        --amberbg: #fff3db;
        --green: #146a43;
        --greenbg: #e5f6ed;
        --purple: #7441b3;
        --purplebg: #f2ebfc;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      a,
      input,
      select {
        touch-action: manipulation;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 3px;
      }
      button {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
        padding: 9px 13px;
        border-radius: 7px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        white-space: nowrap;
      }
      button:hover:not(:disabled) {
        filter: brightness(1.13);
      }
      button.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: white;
        font-weight: 650;
      }
      button.ghost {
        background: transparent;
        border-color: transparent;
      }
      button.link {
        background: transparent;
        border: 0;
        padding: 0;
        color: var(--blue);
        text-align: left;
        white-space: normal;
      }
      button.small {
        padding: 6px 10px;
        font-size: 13px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 27px;
        line-height: 1.25;
        letter-spacing: -0.7px;
      }
      h2 {
        font-size: 17px;
        letter-spacing: -0.25px;
      }
      h3 {
        font-size: 14px;
      }
      small,
      .muted {
        color: var(--muted);
      }
      small {
        font-size: 12px;
      }
      .money {
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .right {
        text-align: right;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .between {
        justify-content: space-between;
      }
      .stack {
        display: grid;
        gap: 20px;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        border-radius: 20px;
        padding: 4px 10px;
        font-size: 12px;
        line-height: 1.4;
        font-weight: 650;
        white-space: nowrap;
      }
      .badge.amber {
        background: var(--amberbg);
        color: var(--amber);
      }
      .badge.green {
        background: var(--greenbg);
        color: var(--green);
      }
      .badge.blue {
        background: var(--bluebg);
        color: var(--blue);
      }
      .badge.purple {
        background: var(--purplebg);
        color: var(--purple);
      }
      .prototype {
        background: #e4c384;
        color: #34250f;
        min-height: 34px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 5px 20px;
        font-size: 12px;
      }
      .prototype button {
        color: #34250f;
        border-color: #9c7839;
        background: transparent;
        font-size: 11px;
        padding: 2px 8px;
      }
      .sidebar {
        position: fixed;
        top: 34px;
        left: 0;
        bottom: 0;
        width: 220px;
        padding: 28px 16px;
        background: var(--inset);
        border-right: 1px solid var(--line);
      }
      .brand {
        font-weight: 750;
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 34px;
        padding: 0 12px;
      }
      .brand span {
        background: #fff;
        color: #285993;
        border-radius: 7px;
        padding: 9px 7px;
        font-size: 12px;
      }
      .sidebar small {
        display: block;
        margin: 0 12px 12px;
      }
      .nav {
        display: grid;
        gap: 5px;
      }
      .nav button {
        justify-content: flex-start;
        background: transparent;
        border-color: transparent;
        padding: 10px 12px;
      }
      .nav button.active {
        background: var(--bluebg);
        color: var(--blue);
      }
      .nav .inactive {
        padding: 10px 12px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .sidebar footer {
        position: absolute;
        bottom: 20px;
        left: 28px;
        color: var(--muted);
        font-size: 12px;
      }
      .shell {
        margin-left: 220px;
      }
      .topbar {
        height: 60px;
        border-bottom: 1px solid var(--line);
        padding: 0 30px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .content {
        max-width: 1280px;
        padding: 20px 30px 60px;
        margin: auto;
      }
      .toolbar {
        position: sticky;
        top: 0;
        z-index: 8;
        background: var(--bg);
        padding: 10px 0 14px;
        display: flex;
        justify-content: space-between;
        gap: 10px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 22px;
      }
      .identity {
        margin-bottom: 22px;
      }
      .identity p {
        margin-top: 7px;
        color: var(--muted);
      }
      .content.order-content {
        max-width: 1560px;
      }
      .order-heading {
        padding: 21px 24px;
        border-radius: 11px;
        background: linear-gradient(115deg, #5944aa, #953d97);
        color: white;
      }
      .order-heading p {
        color: #f2eafa;
      }
      .order-overview > .section-head {
        background: var(--bluebg);
      }
      .order-information {
        display: grid;
        grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr);
        gap: 25px;
        padding: 22px;
      }
      .order-data {
        display: grid;
        align-content: start;
        gap: 17px;
      }
      .order-data dt {
        color: var(--muted);
        font-size: 12px;
      }
      .order-data dd {
        margin: 4px 0 0;
        font-weight: 550;
      }
      .order-work {
        padding: 14px 16px;
        border-radius: 7px;
        background: var(--purplebg);
      }
      .order-work h3 {
        font-size: 12px;
        color: var(--muted);
        font-weight: 500;
        margin-bottom: 5px;
      }
      .order-amounts {
        margin-top: 15px;
        border: 1px solid #41735e;
        border-radius: 8px;
        padding: 15px 17px;
        background: var(--greenbg);
      }
      .order-amounts .amount-line {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
      }
      .order-amounts .amount-line:last-child {
        margin-bottom: 0;
      }
      .order-amounts .amount-line span {
        color: var(--muted);
        font-size: 13px;
      }
      .order-amounts .amount-line strong {
        font-weight: 550;
      }
      .order-amounts .amount-total {
        padding-top: 12px;
        border-top: 1px solid #41735e;
        margin-top: 13px;
      }
      .order-amounts .amount-total span,
      .order-amounts .amount-total strong {
        font-size: 16px;
        color: var(--text);
        font-weight: 700;
      }
      .order-amounts .amount-pending {
        padding-top: 10px;
      }
      .order-amounts .amount-pending span {
        color: var(--text);
        font-weight: 650;
      }
      .order-amounts .amount-pending strong {
        color: var(--green);
        font-size: 22px;
        font-weight: 750;
      }
      .repair-gain {
        padding: 12px 15px;
        margin-top: 15px;
        border: 1px solid var(--line);
        border-radius: 7px;
      }
      .repair-gain small {
        display: block;
        margin-top: 4px;
      }
      .order-content .section-head.products,
      .order-content .section-head.parts {
        background: var(--inset);
      }
      .icon-pill {
        width: 31px;
        height: 31px;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        border-radius: 7px;
        background: var(--bluebg);
        color: var(--blue);
      }
      .icon-pill.part {
        background: var(--amberbg);
        color: var(--amber);
      }
      .order-content .table-wrap th,
      .order-content .table-wrap td {
        padding: 12px 16px;
      }
      .parts-table {
        min-width: 660px;
      }
      .parts-table td:first-child {
        width: 32%;
      }
      .mobile-cost {
        display: none;
      }
      .order-content .sale-meta {
        padding: 12px 16px;
      }
      .order-content .sale-meta p {
        font-size: 12px;
        color: var(--muted);
      }
      @media (max-width: 1150px) and (min-width: 901px) {
        .order-information {
          grid-template-columns: 1fr;
        }
        .order-data {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (max-width: 650px) {
        .order-information {
          grid-template-columns: 1fr;
          padding: 16px;
          gap: 19px;
        }
        .order-information > div {
          order: -1;
        }
        .parts-table {
          min-width: 0;
        }
        .parts-table td:first-child {
          width: 60%;
        }
        .parts-table th:nth-child(3),
        .parts-table td:nth-child(3),
        .parts-table th:nth-child(4),
        .parts-table td:nth-child(4),
        .parts-table th:nth-child(5),
        .parts-table td:nth-child(5) {
          display: none;
        }
        .parts-table .mobile-cost {
          display: block;
        }
        .order-data {
          grid-template-columns: 1fr 1fr;
          gap: 14px;
        }
        .order-heading {
          padding: 17px;
        }
        .order-amounts .amount-pending strong {
          font-size: 24px;
        }
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 265px;
        gap: 22px;
        align-items: start;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 11px;
        overflow: hidden;
        min-width: 0;
      }
      .pad {
        padding: 20px;
      }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        padding: 16px 20px;
        border-bottom: 1px solid var(--line);
      }
      .section-head p {
        font-size: 12px;
        margin-top: 3px;
        color: var(--muted);
      }
      .section-head.repair {
        background: var(--amberbg);
      }
      .section-head.products {
        background: var(--bluebg);
      }
      .section-head.share {
        background: var(--purplebg);
      }
      .section-head svg {
        width: 19px;
        height: 19px;
      }
      .summary {
        border-top: 3px solid var(--primary);
      }
      .totals {
        display: grid;
        grid-template-columns: 1fr 1fr 1.2fr;
        gap: 18px;
        padding: 20px;
      }
      .totals dt {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 5px;
      }
      .totals dd {
        font-size: 24px;
        font-weight: 700;
        margin: 0;
        letter-spacing: -0.5px;
      }
      .totals .pending {
        border-left: 1px solid var(--line);
        padding-left: 20px;
      }
      .totals .pending dt {
        color: var(--text);
        font-weight: 650;
      }
      .totals .pending dd {
        color: var(--blue);
        font-size: 28px;
      }
      .totals .paid dd {
        color: var(--green);
      }
      .summary-footer {
        border-top: 1px solid var(--line);
        padding: 10px 20px;
        color: var(--muted);
        font-size: 12px;
      }
      .summary-footer strong {
        color: var(--text);
        font-weight: 550;
      }
      .table-wrap {
        overflow: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        padding: 10px 20px;
        text-align: left;
        color: var(--muted);
        background: var(--inset);
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
      }
      td {
        padding: 14px 20px;
        border-top: 1px solid var(--line);
        vertical-align: middle;
      }
      td small {
        display: block;
        margin-top: 3px;
      }
      td:first-child {
        width: 50%;
      }
      .table-foot {
        padding: 12px 20px;
        border-top: 1px solid var(--line);
        font-weight: 650;
      }
      .details {
        padding: 13px 20px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
      }
      .details summary {
        cursor: pointer;
        color: var(--blue);
      }
      .details p {
        margin-top: 10px;
      }
      .equipment {
        padding: 0 0 4px;
        display: flex;
        gap: 20px;
        align-items: baseline;
        flex-wrap: wrap;
      }
      .equipment p {
        font-size: 13px;
        color: var(--muted);
      }
      .history {
        position: sticky;
        top: 84px;
        max-height: calc(100dvh - 104px);
        overflow: auto;
      }
      .timeline {
        list-style: none;
        padding: 20px;
        margin: 0;
      }
      .timeline li {
        position: relative;
        padding: 0 0 26px 32px;
      }
      .timeline li:last-child {
        padding-bottom: 0;
      }
      .timeline li:not(:last-child):after {
        content: '';
        position: absolute;
        left: 8px;
        top: 21px;
        bottom: 4px;
        width: 1px;
        background: var(--line);
      }
      .timeline li:before {
        content: '✓';
        position: absolute;
        left: 0;
        top: 1px;
        color: var(--blue);
        font-size: 11px;
        border-radius: 50%;
        background: var(--bluebg);
        width: 18px;
        height: 18px;
        text-align: center;
      }
      .timeline .current:before {
        content: '●';
        background: var(--primary);
        color: white;
      }
      .timeline small {
        display: block;
        margin-top: 2px;
      }
      .timeline .future {
        color: var(--muted);
      }
      .timeline .future:before {
        content: '5';
        background: var(--inset);
        color: var(--muted);
      }
      .history-note {
        border-top: 1px solid var(--line);
        margin: 0 20px;
        padding: 14px 0;
        color: var(--muted);
        font-size: 12px;
      }
      .participant-tabs {
        display: flex;
        gap: 5px;
        border-bottom: 1px solid var(--line);
        padding: 0 20px;
      }
      .participant-tabs button {
        border: 0;
        border-radius: 0;
        background: transparent;
        padding: 11px 12px;
        color: var(--muted);
        border-bottom: 2px solid transparent;
      }
      .participant-tabs button[aria-selected='true'] {
        border-bottom-color: var(--purple);
        color: var(--text);
      }
      .share-numbers {
        display: flex;
        gap: 25px;
        align-items: center;
        padding: 16px 20px;
        flex-wrap: wrap;
      }
      .share-numbers span {
        color: var(--muted);
        display: block;
        font-size: 12px;
      }
      .share-numbers strong {
        display: block;
        font-size: 18px;
        margin-top: 3px;
      }
      .share-numbers .share-total {
        margin-left: auto;
      }
      .share-total strong {
        color: var(--purple);
      }
      .empty {
        padding: 18px 20px;
        color: var(--muted);
        font-size: 13px;
      }
      .filterbar {
        display: flex;
        align-items: end;
        gap: 12px;
        flex-wrap: wrap;
        margin: 22px 0 16px;
      }
      .filterbar label:first-child {
        flex: 1;
        min-width: 230px;
      }
      .field {
        display: grid;
        gap: 7px;
        min-width: 0;
      }
      .field > span {
        font-size: 13px;
        font-weight: 600;
      }
      .field input,
      .field select,
      input.search {
        width: 100%;
        background: var(--inset);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 10px 12px;
        color: var(--text);
      }
      .sales-table td:first-child {
        width: auto;
      }
      .sales-table th,
      .sales-table td {
        padding: 14px 16px;
      }
      .table-caption {
        padding: 11px 16px;
        color: var(--muted);
        font-size: 12px;
        border-top: 1px solid var(--line);
      }
      .form {
        max-width: 880px;
        margin: auto;
      }
      .form .panel {
        padding: 25px;
      }
      .fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: start;
        gap: 18px;
      }
      .form hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 24px 0;
      }
      .search-box {
        position: relative;
        margin: 12px 0;
      }
      .search-box input {
        padding-left: 37px;
      }
      .search-box > svg {
        position: absolute;
        left: 12px;
        top: 13px;
        color: var(--muted);
        width: 16px;
      }
      .search-results {
        position: absolute;
        top: 48px;
        left: 0;
        right: 0;
        z-index: 5;
        background: var(--panel);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
        border-radius: 8px;
        overflow: hidden;
      }
      .search-results:empty {
        display: none;
      }
      .search-results button {
        border: 0;
        border-radius: 0;
        width: 100%;
        padding: 13px 16px;
        justify-content: space-between;
        text-align: left;
      }
      .selected-product {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px;
        margin-top: 15px;
      }
      .quantity {
        background: var(--inset);
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--text);
        padding: 7px 9px;
        width: 70px;
      }
      .form-total {
        background: var(--bluebg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 17px;
        display: flex;
        justify-content: space-between;
        margin: 22px 0;
        align-items: center;
      }
      .form-total strong {
        font-size: 22px;
      }
      .form-footer {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        flex-wrap: wrap;
      }
      .hint {
        padding: 12px 15px;
        background: var(--bluebg);
        border-radius: 7px;
        color: var(--blue);
        margin-bottom: 22px;
        font-size: 13px;
      }
      .notice {
        border-left: 3px solid var(--green);
        padding: 12px 16px;
        background: var(--greenbg);
        border-radius: 6px;
        color: var(--green);
        margin-bottom: 20px;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .metric {
        padding: 18px;
      }
      .metric p {
        color: var(--muted);
        font-size: 13px;
      }
      .metric strong {
        display: block;
        font-size: 27px;
        margin: 5px 0;
      }
      .earnings-hero {
        background: linear-gradient(115deg, #343b99, #753baa);
        padding: 24px;
        color: white;
        border-radius: 12px;
      }
      .earnings-hero p {
        color: #e7ddff;
      }
      .chart {
        display: grid;
        gap: 18px;
        padding: 20px;
      }
      .bar {
        height: 8px;
        border-radius: 8px;
        background: var(--inset);
        margin-top: 8px;
        overflow: hidden;
      }
      .bar span {
        display: block;
        height: 100%;
        background: var(--blue);
        border-radius: 8px;
      }
      .bar.amber span {
        background: var(--amber);
      }
      dialog {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 13px;
        padding: 0;
        max-width: 520px;
        width: calc(100vw - 32px);
        box-shadow: var(--shadow);
        max-height: calc(100dvh - 32px);
      }
      dialog::backdrop {
        background: #080910b3;
        backdrop-filter: blur(3px);
      }
      .product-modal {
        max-width: 780px;
        overflow: hidden;
      }
      .product-modal-layout {
        display: flex;
        flex-direction: column;

  <body>
    <div class="prototype">
      <span
        ><strong>Propuesta visual</strong> · Datos ficticios<span class="extra">
          · Los cambios sólo viven en esta maqueta</span

      ><button onclick="resetDemo()">Reiniciar ejemplo</button>
    </div>
    <aside class="sidebar">
      <div class="brand"><span>SC</span> SC.EXE</div>
      <small>Gestión</small>
      <nav class="nav" aria-label="Navegación principal">
        <button data-nav="orders" onclick="navigate('orders')"></button
        ><span class="inactive" id="catalog-nav"></span
        ><button data-nav="sales" onclick="navigate('sales')"></button
        ><span class="inactive" id="customers-nav"></span
        ><button data-nav="earnings" onclick="navigate('earnings')"></button>
      </nav>
      <footer>Septiembre de 2026<br />Ejemplo para revisar el flujo</footer>
    </aside>
    <div class="shell">
      <header class="topbar">
        <span id="breadcrumb"></span
        ><button
          class="ghost small"
          onclick="toggleTheme()"
          aria-label="Cambiar entre tema claro y oscuro"
          id="theme-button"
        ></button>
      </header>
      <main class="content" id="app"></main>
    </div>
    <dialog
      id="add-products"
      class="product-modal"
      aria-labelledby="add-products-title"
      aria-describedby="add-products-description"
    ></dialog>
    <dialog id="payment" aria-labelledby="payment-title">
      <form id="payment-form">
        <div class="dialog-head">
          <div class="row between">
            <h2 id="payment-title"></h2>
            <button
              type="button"
              class="ghost small"
              onclick="closePayment()"
              aria-label="Cerrar confirmación de cobro"
            >
              ✕
            </button>
          </div>
          <p class="muted" id="payment-subtitle" style="margin-top: 6px"></p>
        </div>
        <div class="dialog-body">
          <div class="bill" id="payment-bill"></div>
          <div class="fields">
            <label class="field"
              ><span>Fecha del cobro</span
              ><input
                id="payment-date"
                type="date"
                value="2026-09-29"
                required /></label
            ><label class="field"
              ><span>Medio de pago</span
              ><select id="payment-method" required>
                <option value="">Seleccionar</option>
                <option>Efectivo</option>
                <option>Transferencia</option>
                <option>Tarjeta</option>
              </select></label
            >
          </div>
          <p class="muted" style="font-size: 12px; margin-top: 18px">
            Confirmá cuando hayas recibido el pago del cliente.
          </p>
        </div>
        <div class="dialog-footer">
          <button type="button" onclick="closePayment()">Volver</button
          ><button type="submit" class="primary" id="payment-confirm"></button>
        </div>
      </form>
    </dialog>
    <div id="toast" class="toast" role="status" hidden></div>
    <script>
      const icons = {
        back: '<path d="m12 5-7 7 7 7M5 12h14"/>',
        order:
          '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M9 10h6M9 15h6"/>',
        box: '<path d="m12 3 9 5v8l-9 5-9-5V8l9-5ZM3 8l9 5 9-5M12 13v8M7 5.8l10 5.5"/>',
        sale: '<rect x="4" y="7" width="16" height="14" rx="2"/><path d="M8 7V5a4 4 0 0 1 8 0v2"/>',
        chart: '<path d="M4 3v17h17M8 15l4-5 4 2 5-7"/>',
        user: '<circle cx="12" cy="7" r="4"/><path d="M5 21v-3a7 7 0 0 1 14 0v3"/>',
        search: '<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>',
        plus: '<path d="M12 5v14M5 12h14"/>',
        clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
        sun: '<circle cx="12" cy="12" r="4"/><path d="M12 1v2M12 21v2M1 12h2M21 12h2M4 4l2 2M18 18l2 2M20 4l-2 2M6 18l-2 2"/>',
        tool: '<path d="m14 5 3 3 4-4a6 6 0 0 1-8 8l-8 8a2 2 0 0 1-3-3l8-8a6 6 0 0 1 4-8Z"/>',
      };
      const icon = (k) =>
        `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[k] || icons.box}</svg>`;
      const esc = (v) =>
        String(v).replace(
          /[&<>"']/g,
          (c) =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;',
            })[c],
        );
      const money = (v) =>
        new Intl.NumberFormat('es-AR', {
          style: 'currency',
          currency: 'ARS',
          maximumFractionDigits: 0,
        }).format(v);
      const badge = (paid) =>
        `<span class="badge ${paid ? 'green' : 'amber'}">${paid ? 'Cobrada' : 'Pendiente de cobro'}</span>`;
      const date = (v) => v.split('-').reverse().join('/');
      const products = [
        {
          id: 1,
          name: 'Mouse inalámbrico Logitech M170',
          price: 7500,
          cost: 5000,
          stock: 8,
          buyer: 'Fiorella',
        },
        {
          id: 2,
          name: 'Funda notebook 15,6″',
          price: 12600,
          cost: 9000,
          stock: 4,
          buyer: 'Tefi',
        },
        {
          id: 3,
          name: 'Teclado Logitech K120',
          price: 11200,
          cost: 8000,
          stock: 3,
          buyer: 'Tefi',
        },
      ];
      let state,
        view = 'order',
        orderOrigin = 'orders',
        origin = 'sales',
        selectedSale = 104,
        draft,
        pendingPayment,
        participant = 'Tefi',
        toastTimer;
      let saleFilters = { query: '', status: 'all', origin: 'all' };
      let productsScrollY = 0,
        previousBodyOverflow = '';
      function resetDemo() {
        orderOrigin = 'orders';
        view = 'order';
        state = {
          repairPaid: false,
          delivered: false,
          sales: [
            {
              id: 104,
              client: 'Gabriela Díaz',
              order: true,
              paid: false,
              items: [{ ...products[1], qty: 1 }],
              date: '2026-09-28',
            },
            {
              id: 105,
              client: 'Carla Sosa',
              order: false,
              paid: true,
              items: [{ ...products[2], qty: 1 }],
              date: '2026-09-29',
              paidDate: '2026-09-29',
              method: 'Transferencia',
            },
          ],
        };
        saleFilters = { query: '', status: 'all', origin: 'all' };
        participant = 'Tefi';
        navigate('order');
      }
      const saleTotal = (s) => s.items.reduce((a, p) => a + p.price * p.qty, 0);
      const linked = () => state.sales.filter((s) => s.order);
      const monthlySales = () =>
        state.sales.filter((s) => s.paid && s.paidDate.startsWith('2026-09-'));
      const orderTotal = () =>
        30000 + linked().reduce((a, s) => a + saleTotal(s), 0);
      const orderPaid = () =>
        (state.repairPaid ? 30000 : 0) +
        linked()
          .filter((s) => s.paid)
          .reduce((a, s) => a + saleTotal(s), 0);
      function shares(sales, name) {
        let cost = 0,
          gain = 0;
        for (const s of sales.filter((s) => s.paid))
          for (const p of s.items) {
            cost += p.buyer === name ? p.cost * p.qty : 0;
            gain += (p.price - p.cost) * p.qty * 0.5;
          }
        return { cost, gain, total: cost + gain };
      }
      function navigate(next) {
        if (
          next === 'order' &&
          ['orders', 'sales', 'earnings'].includes(view)
        ) {
          orderOrigin = view;
        } else if (
          next === 'order' &&
          view === 'detail' &&
          origin !== 'order'
        ) {
          orderOrigin = origin;
        }
        clearTimeout(toastTimer);
        document.getElementById('toast').hidden = true;
        view = next;
        render();
        window.scrollTo(0, 0);
      }
      function openSale(id, from = 'sales') {
        selectedSale = id;
        origin = from;
        navigate('detail');
      }
      function startSale(order = false) {
        draft = {
          order,
          client: order ? 'Gabriela Díaz' : '',
          items: [],
          date: '2026-09-29',
        };
        if (order) {
          openProductsModal();
        } else {
          navigate('new');
        }
      }
      function openProductsModal() {
        const dialog = document.getElementById('add-products');
        productsScrollY = window.scrollY;
        previousBodyOverflow = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
        clearTimeout(toastTimer);
        document.getElementById('toast').hidden = true;
        dialog.innerHTML = `<div class="product-modal-layout">
          <div class="dialog-head"><div class="row between"><h2 id="add-products-title">Agregar productos</h2><button class="ghost small" onclick="closeProductsModal()" aria-label="Cerrar agregado de productos">✕</button></div><p id="add-products-description" class="muted" style="margin-top:5px">Pedido PE576GD · Gabriela Díaz</p></div>
          <div class="product-modal-body"><div class="search-box">${icon('search')}<input class="search" id="product-search" type="search" placeholder="Buscar producto por nombre o marca…" aria-label="Buscar producto" aria-controls="search-results" aria-expanded="false" autocomplete="off" oninput="searchProducts(this.value)"><div class="search-results" id="search-results"></div></div><div id="selected-products"></div></div>
          <div class="dialog-footer"><div class="product-modal-total"><div class="row between"><span>Total a agregar</span><strong id="draft-total" class="money">${money(0)}</strong></div><p>Pendiente del pedido: <span id="draft-pending" class="money"></span></p><p>Se agrega como una venta pendiente de cobro.</p></div><div class="product-modal-actions"><button onclick="closeProductsModal()">Cancelar</button><button id="save-order" class="primary" onclick="saveDraft(false)" disabled>Agregar al pedido</button></div></div>
        </div>`;
        renderDraft();
        dialog.showModal();
        document.getElementById('product-search').focus();
      }
      function cleanupProductsModal() {
        const dialog = document.getElementById('add-products');
        if (dialog.open) return;
        document.body.style.overflow = previousBodyOverflow;
        dialog.replaceChildren();
      }
      function closeProductsModal() {
        document.getElementById('add-products').close();
        cleanupProductsModal();
      }
      document
        .getElementById('add-products')
        .addEventListener('close', cleanupProductsModal);
      document.addEventListener('keydown', (event) => {
        const results = document.getElementById('search-results');
        if (!results) return;
        if (event.target.id === 'product-search') {
          if (event.key === 'ArrowDown' && results.querySelector('button')) {
            event.preventDefault();
            results.querySelector('button').focus();
          } else if (event.key === 'Escape' && results.textContent) {
            event.preventDefault();
            searchProducts('');
          }
        } else if (
          event.target.closest('#search-results') &&
          ['ArrowDown', 'ArrowUp'].includes(event.key)
        ) {
          const buttons = [...results.querySelectorAll('button')];
          const index = buttons.indexOf(event.target);
          event.preventDefault();
          buttons[
            (index + (event.key === 'ArrowDown' ? 1 : buttons.length - 1)) %
              buttons.length
          ]?.focus();
        }
      });
      function toggleTheme() {
        document.body.classList.toggle('light');
      }
      function notify(message) {
        clearTimeout(toastTimer);
        const t = document.getElementById('toast');
        t.textContent = message;
        t.hidden = false;
        toastTimer = setTimeout(() => (t.hidden = true), 4200);
      }
      function backButton(label, target) {
        return `<button class="ghost" onclick="navigate('${target}')">${icon('back')}<span class="back-label">${label}</span></button>`;
      }
      function summary(total, paid) {
        return `<section class="panel summary" aria-label="Resumen de cobro"><dl class="totals"><div><dt>Total</dt><dd class="money">${money(total)}</dd></div><div class="paid"><dt>Ya cobrado</dt><dd class="money">${money(paid)}</dd></div><div class="pending"><dt>Pendiente de cobrar</dt><dd class="money">${money(total - paid)}</dd></div></dl></section>`;
      }
      function productTable(s) {
        return `<div class="table-wrap"><table><thead><tr><th>Producto</th><th>Cant.</th><th class="right optional">Precio</th><th class="right">Subtotal</th></tr></thead><tbody>${s.items.map((p) => `<tr><td><strong>${esc(p.name)}</strong></td><td>${p.qty}</td><td class="right money optional">${money(p.price)}</td><td class="right money"><strong>${money(p.price * p.qty)}</strong></td></tr>`).join('')}</tbody></table></div>`;
      }
      function distribution(sales) {
        const paid = sales.filter((s) => s.paid);
        if (!paid.length)
          return `<section class="panel pad" aria-label="Ventas por participante"><h3>Ventas · Participantes</h3><p class="muted" style="font-size:12px;margin-top:5px">Los importes aparecen al registrar el cobro de los productos.</p></section>`;
        return `<section class="panel" aria-label="Ventas por participante"><div class="section-head share"><div><h2>Ventas · Participantes</h2><p>Lo que corresponde por productos cobrados.</p></div></div>${paid.length ? `<div class="participant-tabs" role="tablist" aria-label="Participantes">${['Tefi', 'Fiorella'].map((name) => `<button id="tab-${name}" type="button" role="tab" aria-controls="participant-panel" tabindex="${participant === name ? 0 : -1}" aria-selected="${participant === name}" onclick="setParticipant('${name}')">${name}</button>`).join('')}</div><div id="participant-panel" role="tabpanel" aria-labelledby="tab-${participant}">${shareContent(paid)}</div>` : '<p class="empty">Los importes por participante aparecen al registrar el cobro de los productos.</p>'}</section>`;
      }
      function shareContent(sales) {
        const p = shares(sales, participant);
        return `<div class="share-numbers"><div><span>Costo que recupera</span><strong class="money">${money(p.cost)}</strong></div><div><span>Ganancia</span><strong class="money">${money(p.gain)}</strong></div><div class="share-total"><span>Total para ${participant}</span><strong class="money">${money(p.total)}</strong></div></div>`;
      }
      function setParticipant(name) {
        participant = name;
        const selected =
          view === 'order'
            ? linked()
            : view === 'detail'
              ? [state.sales.find((s) => s.id === selectedSale)]
              : monthlySales();
        document.querySelectorAll('[role=tab]').forEach((b) => {
          b.setAttribute('aria-selected', b.id === `tab-${name}`);
          b.tabIndex = b.id === `tab-${name}` ? 0 : -1;
        });
        const p = document.getElementById('participant-panel');
        p.setAttribute('aria-labelledby', `tab-${name}`);
        p.innerHTML = shareContent(selected);
        document.getElementById(`tab-${name}`).focus();
      }
      document.addEventListener('keydown', (e) => {
        if (
          e.target.getAttribute('role') === 'tab' &&
          ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)
        ) {
          e.preventDefault();
          setParticipant(
            e.key === 'Home'
              ? 'Tefi'
              : e.key === 'End'
                ? 'Fiorella'
                : participant === 'Tefi'
                  ? 'Fiorella'
                  : 'Tefi',
          );
        }
      });
      function orderView() {
        const pending = orderTotal() - orderPaid();
        return `<div class="toolbar">${backButton(orderOrigin === 'sales' ? 'Volver a ventas' : orderOrigin === 'earnings' ? 'Volver a rendimientos' : 'Volver a pedidos', orderOrigin)}
          ${!state.delivered ? `<button class="primary" onclick="openPayment('order')">Entregar y cobrar ${money(pending)}</button>` : '<span class="badge green">Entregado y cobrado</span>'}
        </div>
        <header class="identity order-heading">
          <div class="row"><h1>Pedido PE576GD</h1><span class="badge ${state.delivered ? 'green' : 'blue'}">${state.delivered ? 'Entregado' : 'Finalizado'}</span></div>
          <p>Gabriela Díaz · Notebook Acer</p>
        </header>
        <div class="layout">
          <div class="stack">
            <section class="panel order-overview" aria-label="Información del pedido">
              <div class="section-head"><div class="row"><span class="icon-pill">${icon('order')}</span><div><h2>Información del pedido</h2><p>Equipo, trabajo e importes.</p></div></div></div>
              <div class="order-information">
                <dl class="order-data">
                  <div><dt>Cliente</dt><dd>Gabriela Díaz</dd></div>
                  <div><dt>Equipo</dt><dd>Notebook Acer</dd></div>
                  <div><dt>Estado de ingreso</dt><dd>Se apaga al desconectar el cargador.</dd></div>
                  <div><dt>Fecha de ingreso</dt><dd>22/09/2026 · 12:00</dd></div>
                  <div><dt>Cargador</dt><dd>Incluido</dd></div>
                </dl>
                <div>
                  <div class="order-work"><h3>Trabajo a realizar</h3><p>Cambio de batería y revisión general.</p></div>
                  <section class="order-amounts" aria-label="Resumen de cobro">
                    <div class="amount-line"><span>Mano de obra</span><strong class="money">${money(10000)}</strong></div>
                    <div class="amount-line"><span>Repuestos</span><strong class="money">${money(20000)}</strong></div>
                    <div class="amount-line"><span>Venta de productos</span><strong class="money">${money(orderTotal() - 30000)}</strong></div>
                    <div class="amount-line amount-total"><span>Total del pedido</span><strong class="money">${money(orderTotal())}</strong></div>
                    <div class="amount-line"><span>Ya cobrado</span><strong class="money">${money(orderPaid())}</strong></div>
                    <div class="amount-line amount-pending"><span>Pendiente de cobrar</span><strong class="money">${money(pending)}</strong></div>
                  </section>
                  <div class="repair-gain"><div class="row between"><span>${state.repairPaid ? 'Ganancia de reparación' : 'Ganancia prevista de reparación'}</span><strong class="money">${money(14000)}</strong></div><small>Mano de obra ${money(10000)} + ganancia de repuestos ${money(4000)}.${state.repairPaid ? '' : ' Se suma a rendimientos al cobrar.'}</small></div>
                </div>
              </div>
            </section>
            <section class="panel" aria-label="Repuestos del pedido">
              <div class="section-head parts"><div class="row"><span class="icon-pill part">${icon('tool')}</span><div><h2>Repuestos</h2><p>Comprados para reparar este equipo.</p></div></div><strong class="money">${money(20000)}</strong></div>
              <div class="table-wrap" role="region" aria-label="Detalle de repuestos" tabindex="0"><table class="parts-table"><thead><tr><th>Repuesto</th><th>Cant.</th><th class="right">Costo unit.</th><th class="right">Ganancia</th><th class="right">Precio unit.</th><th class="right">Total</th></tr></thead><tbody><tr><td><strong>Batería Acer</strong><small>Comprada el 24/09 · Proveedor del ejemplo</small><small class="mobile-cost">Costo ${money(16000)} · Ganancia 25 % · Precio ${money(20000)}</small></td><td>1</td><td class="right money">${money(16000)}</td><td class="right">25 %</td><td class="right money">${money(20000)}</td><td class="right money"><strong>${money(20000)}</strong></td></tr></tbody></table></div>
            </section>
            <section class="panel" aria-label="Ventas de productos del pedido">
              <div class="section-head products"><div class="row"><span class="icon-pill">${icon('sale')}</span><div><h2>Ventas de productos</h2><p>Productos del inventario vendidos con este pedido.</p></div></div>${!state.delivered ? `<button class="small" onclick="startSale(true)">${icon('plus')} Agregar productos</button>` : ''}</div>
              ${linked()
                .map(
                  (s) =>
                    `<div class="sale-meta row between"><button class="link" onclick="openSale(${s.id},'order')">Venta V${s.id}</button>${badge(s.paid)}</div>${productTable(s)}<div class="table-foot row between"><span class="money">Total venta ${money(saleTotal(s))}</span>${!s.paid ? `<button class="small" onclick="openPayment('sale',${s.id})">Cobrar esta venta por separado</button>` : `<small>${esc(s.method)} · ${date(s.paidDate)}</small>`}</div>`,
                )
                .join('')}
              <div class="summary-footer">${linked().some((s) => !s.paid) ? 'Las ventas pendientes están incluidas en el saldo a cobrar del pedido.' : 'Estas ventas ya están cobradas y descontadas del saldo pendiente.'}</div>
            </section>
            ${distribution(linked())}
          </div>
          <aside class="panel history" aria-label="Historial del pedido">
            <div class="section-head"><h2>${icon('clock')} Historial del pedido</h2></div>
            <ol class="timeline"><li>En revisión<small>22/09 · 12:00</small></li><li>Pendiente aprobación<small>23/09 · 10:30</small></li><li>En proceso<small>24/09 · 09:15</small></li><li class="${state.delivered ? '' : 'current'}">Finalizado<small>28/09 · 16:40</small></li><li class="${state.delivered ? 'current' : 'future'}">${state.delivered ? 'Entregado' : 'Pendiente de entrega'}<small>${state.delivered ? date(state.repairDate) : 'El equipo está listo para retirar'}</small></li></ol>
            <p class="history-note">${state.delivered ? 'Cobro registrado al entregar.' : 'Próximo paso: entregar el equipo y registrar el cobro pendiente.'}</p>
          </aside>
        </div>`;
      }
      function ordersView() {
        return `<header class="identity"><h1>Pedidos</h1><p>Seguimiento de equipos y cobros.</p></header><section class="panel"><div class="table-wrap"><table><thead><tr><th>Cliente / pedido</th><th>Estado</th><th class="right">Pendiente</th><th></th></tr></thead><tbody><tr><td><button class="link" onclick="navigate('order')">Gabriela Díaz</button><small>Notebook Acer · PE576GD</small></td><td><span class="badge blue">${state.delivered ? 'Entregado' : 'Finalizado'}</span></td><td class="right money">${money(orderTotal() - orderPaid())}</td><td><button class="small" onclick="navigate('order')">Ver pedido</button></td></tr></tbody></table></div><div class="table-caption">1 pedido de ejemplo</div></section>`;
      }
      function salesRows() {
        let sales = state.sales.filter(
          (s) =>
            (saleFilters.status === 'all' ||
              (saleFilters.status === 'paid') === s.paid) &&
            (saleFilters.origin === 'all' ||
              (saleFilters.origin === 'order') === s.order) &&
            `${s.client} V${s.id} ${s.order ? 'PE576GD' : ''} ${s.items.map((p) => p.name).join(' ')}`
              .toLowerCase()
              .includes(saleFilters.query.toLowerCase()),
        );
        return sales.length
          ? sales
              .slice()
              .reverse()
              .map(
                (s) =>
                  `<tr><td><button class="link" onclick="openSale(${s.id})">V${s.id}</button><small>${date(s.date)}</small></td><td><strong>${esc(s.client)}</strong><small>${s.items.reduce((a, p) => a + p.qty, 0)} producto${s.items.reduce((a, p) => a + p.qty, 0) > 1 ? 's' : ''}</small></td><td>${s.order ? `<button class="link" onclick="navigate('order')">Pedido PE576GD</button>` : 'Venta directa'}</td><td>${badge(s.paid)}</td><td class="right money"><strong>${money(saleTotal(s))}</strong></td><td class="right"><button class="small" onclick="openSale(${s.id})">Ver venta</button></td></tr>`,
              )
              .join('')
          : '<tr><td colspan="6" class="empty">No hay ventas con estos filtros.</td></tr>';
      }
      function salesView() {
        return `<header class="identity row between"><div><h1>Ventas</h1><p>Ventas directas y vinculadas a pedidos, en un mismo lugar.</p></div><button class="primary" onclick="startSale()">${icon('plus')} Nueva venta</button></header><div class="filterbar"><label class="field"><span>Buscar</span><input id="sales-search" placeholder="Cliente, producto, venta o pedido…" value="${esc(saleFilters.query)}" oninput="filterSales('query',this.value)"></label><label class="field"><span>Cobro</span><select onchange="filterSales('status',this.value)">${[
          ['all', 'Todos'],
          ['pending', 'Pendiente'],
          ['paid', 'Cobrada'],
        ]
          .map(
            ([v, l]) =>
              `<option value="${v}" ${saleFilters.status === v ? 'selected' : ''}>${l}</option>`,
          )
          .join(
            '',
          )}</select></label><label class="field"><span>Origen</span><select onchange="filterSales('origin',this.value)">${[
          ['all', 'Todos'],
          ['direct', 'Venta directa'],
          ['order', 'Con pedido'],
        ]
          .map(
            ([v, l]) =>
              `<option value="${v}" ${saleFilters.origin === v ? 'selected' : ''}>${l}</option>`,
          )
          .join(
            '',
          )}</select></label></div><section class="panel"><div class="table-wrap"><table class="sales-table"><thead><tr><th>Venta / fecha</th><th>Cliente</th><th>Origen</th><th>Cobro</th><th class="right">Total</th><th></th></tr></thead><tbody id="sales-rows">${salesRows()}</tbody></table></div><div class="table-caption">Septiembre de 2026 · Datos de ejemplo</div></section>`;
      }
      function filterSales(key, value) {
        saleFilters[key] = value;
        document.getElementById('sales-rows').innerHTML = salesRows();
      }
      function detailView() {
        const s = state.sales.find((s) => s.id === selectedSale);
        return `<div class="toolbar">${backButton(origin === 'order' ? 'Volver al pedido' : origin === 'earnings' ? 'Volver a rendimientos' : 'Volver a ventas', origin)}${!s.paid ? `<button class="primary" onclick="openPayment('sale',${s.id})">Registrar cobro ${money(saleTotal(s))}</button>` : badge(true)}</div><header class="identity"><div class="row"><h1>Venta V${s.id}</h1>${badge(s.paid)}</div><p>${esc(s.client)} · ${date(s.date)} · ${s.order ? '<button class="link" onclick="navigate(\'order\')">Pedido PE576GD</button>' : 'Venta directa'}</p></header><div class="stack">${s.paid ? `<div class="notice">Cobro registrado el ${date(s.paidDate)} · ${esc(s.method)}${s.order ? ' · Incluido en lo ya cobrado del pedido.' : ''}</div>` : ''}${summary(saleTotal(s), s.paid ? saleTotal(s) : 0)}<section class="panel"><div class="section-head products"><h2>Productos de la venta</h2></div>${productTable(s)}</section>${distribution([s])}</div>`;
      }
      function newView() {
        return `<div class="form"><div class="toolbar">${backButton(draft.order ? 'Volver al pedido' : 'Volver a ventas', draft.order ? 'order' : 'sales')}</div><header class="identity"><h1>${draft.order ? 'Agregar productos al pedido' : 'Nueva venta'}</h1><p>${draft.order ? 'Gabriela Díaz · Pedido PE576GD' : 'Elegí los productos y revisá el total.'}</p></header><section class="panel">${draft.order ? '<div class="hint">Esta venta se suma al pedido y queda pendiente de cobro.</div>' : ''}<div class="fields"><label class="field"><span>Cliente ${draft.order ? '' : '· Opcional'}</span><input aria-label="Cliente" id="client-search" placeholder="Buscar cliente (opcional)…" autocomplete="off" value="${esc(draft.client)}" ${draft.order ? 'readonly' : ''} oninput="searchClients(this.value)"><div id="client-results"></div>${draft.order ? '' : '<small>Sin seleccionar cliente: Consumidor final.</small>'}</label><label class="field"><span>Fecha de la venta</span><input type="date" value="${draft.date}" required onchange="draft.date=this.value||'2026-09-29'"></label></div><hr><h2>Productos</h2><div class="search-box">${icon('search')}<input class="search" id="product-search" type="search" placeholder="Buscar producto por nombre o marca…" aria-label="Buscar producto" aria-controls="search-results" aria-expanded="false" autocomplete="off" oninput="searchProducts(this.value)"><div class="search-results" id="search-results"></div></div><div id="selected-products"></div><div class="form-total"><span>Total de la venta</span><strong id="draft-total" class="money">${money(0)}</strong></div><div class="form-footer"><button onclick="navigate('${draft.order ? 'order' : 'sales'}')">Cancelar</button>${draft.order ? '<button id="save-order" class="primary" onclick="saveDraft(false)" disabled>Agregar al pedido</button>' : '<button id="save-pending" onclick="saveDraft(false)" disabled>Guardar pendiente</button><button id="save-paid" class="primary" onclick="openPayment(\'draft\')" disabled>Confirmar venta y cobro</button>'}</div></section></div>`;
      }
      function searchClients(query) {
        draft.client = '';
        const q = query.trim().toLowerCase();
        const clients = ['Gabriela Díaz', 'Carla Sosa', 'Martín López'].filter(
          (n) => n.toLowerCase().includes(q),
        );
        document.getElementById('client-results').innerHTML = q
          ? clients.length
            ? clients
                .map(
                  (n) =>
                    `<button type="button" style="width:100%;justify-content:flex-start;margin-bottom:4px" onclick="selectClient('${n}')">${n}</button>`,
                )
                .join('')
            : '<small>Sin coincidencias en este ejemplo.</small>'
          : '';
      }
      function selectClient(name) {
        draft.client = name;
        document.getElementById('client-search').value = name;
        document.getElementById('client-results').innerHTML = '';
      }
      function searchProducts(query) {
        const q = query.trim().toLowerCase();
        const results = document.getElementById('search-results');
        const found = q
          ? products.filter(
              (p) =>
                p.name.toLowerCase().includes(q) &&
                !draft.items.some((i) => i.id === p.id),
            )
          : [];
        results.innerHTML = q
          ? found.length
            ? found
                .map(
                  (p) =>
                    `<button onclick="addProduct(${p.id})"><span><strong>${esc(p.name)}</strong><small style="display:block">Stock disponible: ${p.stock}</small></span><strong class="money">${money(p.price)}</strong></button>`,
                )
                .join('')
            : '<p class="empty">No hay más coincidencias. Probá con otro nombre.</p>'
          : '';
        document
          .getElementById('product-search')
          .setAttribute('aria-expanded', Boolean(q));
      }
      function addProduct(id) {
        draft.items.push({ ...products.find((p) => p.id === id), qty: 1 });
        document.getElementById('product-search').value = '';
        searchProducts('');
        renderDraft();
        document.getElementById('product-search').focus();
      }
      function updateDraftTotals() {
        const added = saleTotal(draft);
        document.getElementById('draft-total').textContent = money(added);
        const pending = document.getElementById('draft-pending');
        if (pending) {
          const before = orderTotal() - orderPaid();
          pending.textContent = added
            ? `${money(before)} → ${money(before + added)}`
            : money(before);
        }
      }
      function updateQty(id, input) {
        const p = draft.items.find((i) => i.id === id);
        p.qty = Math.max(
          1,
          Math.min(p.stock, Math.floor(Number(input.value) || 1)),
        );
        input.value = p.qty;
        document.getElementById(`subtotal-${id}`).textContent = money(
          p.price * p.qty,
        );
        updateDraftTotals();
      }
      function removeProduct(id) {
        draft.items = draft.items.filter((p) => p.id !== id);
        renderDraft();
      }
      function renderDraft() {
        document.getElementById('selected-products').innerHTML = draft.items
          .length
          ? draft.items
              .map(
                (p) =>
                  `<div class="selected-product"><div class="row between"><div><strong>${esc(p.name)}</strong><small style="display:block;margin-top:3px">Precio: ${money(p.price)} · Stock disponible: ${p.stock}</small></div><button class="ghost small" aria-label="Quitar ${esc(p.name)}" onclick="removeProduct(${p.id})">✕</button></div><div class="row between" style="margin-top:15px"><label class="row">Cantidad <input class="quantity" type="number" min="1" max="${p.stock}" value="${p.qty}" onchange="updateQty(${p.id},this)"></label><span>Subtotal: <strong id="subtotal-${p.id}" class="money">${money(p.price * p.qty)}</strong></span></div></div>`,
              )
              .join('')
          : '<p class="empty" style="padding-left:0">Buscá un producto para agregarlo a la venta.</p>';
        updateDraftTotals();
        for (const id of ['save-order', 'save-pending', 'save-paid']) {
          const b = document.getElementById(id);
          if (b) b.disabled = !draft.items.length;
        }
      }
      function saveDraft(paid, payment = {}) {
        if (!draft.items.length) return;
        const s = {
          ...draft,
          client: draft.client.trim() || 'Consumidor final',
          id: Math.max(...state.sales.map((s) => s.id)) + 1,
          paid,
          ...payment,
        };
        state.sales.push(s);
        selectedSale = s.id;
        origin = s.order ? 'order' : 'sales';
        if (s.order) {
          closeProductsModal();
          render();
          document
            .querySelector('[onclick="startSale(true)"]')
            ?.focus({ preventScroll: true });
          window.scrollTo(0, productsScrollY);
        } else {
          navigate('detail');
        }
        notify(
          s.order
            ? 'Productos agregados. El total del pedido se actualizó.'
            : paid
              ? 'Venta y cobro registrados en la maqueta.'
              : 'Venta guardada como pendiente de cobro.',
        );
      }
      function openPayment(kind, id) {
        pendingPayment = { kind, id };
        const s =
          kind === 'draft' ? draft : state.sales.find((s) => s.id === id);
        const isOrder = kind === 'order';
        document.getElementById('payment-title').textContent = isOrder
          ? 'Entregar y cobrar el pedido'
          : 'Confirmar cobro';
        document.getElementById('payment-subtitle').textContent = isOrder
          ? 'Gabriela Díaz · Pedido PE576GD'
          : `${s.client || 'Consumidor final'} · ${kind === 'draft' ? 'Nueva venta' : `Venta V${s.id}`}`;
        const rows = isOrder
          ? [
              ...(!state.repairPaid ? [['Reparación', 30000]] : []),
              ...linked()
                .filter((s) => !s.paid)
                .map((s) => [`Productos · Venta V${s.id}`, saleTotal(s)]),
            ]
          : [['Productos', saleTotal(s)]];
        document.getElementById('payment-bill').innerHTML =
          rows
            .map(
              ([label, total]) =>
                `<div class="row between"><span>${label}</span><strong class="money">${money(total)}</strong></div>`,
            )
            .join('') +
          `<div class="row between"><strong>A cobrar ahora</strong><strong class="money">${money(rows.reduce((a, r) => a + r[1], 0))}</strong></div>`;
        document.getElementById('payment-confirm').textContent = isOrder
          ? 'Confirmar entrega y cobro'
          : kind === 'draft'
            ? 'Confirmar venta y cobro'
            : 'Confirmar cobro';
        document.getElementById('payment-date').value = '2026-09-29';
        document.getElementById('payment-method').value = '';
        document.getElementById('payment').showModal();
      }
      function closePayment() {
        document.getElementById('payment').close();
      }
      document
        .getElementById('payment-form')
        .addEventListener('submit', (e) => {
          e.preventDefault();
          const payment = {
            paidDate: document.getElementById('payment-date').value,
            method: document.getElementById('payment-method').value,
          };
          const { kind, id } = pendingPayment;
          closePayment();
          if (kind === 'draft') {
            saveDraft(true, payment);
            return;
          }
          if (kind === 'order') {
            state.repairPaid = true;
            state.delivered = true;
            state.repairDate = payment.paidDate;
            linked()
              .filter((s) => !s.paid)
              .forEach((s) => Object.assign(s, { paid: true, ...payment }));
          } else
            Object.assign(
              state.sales.find((s) => s.id === id),
              { paid: true, ...payment },
            );
          render();
          notify(
            kind === 'order'
              ? 'Pedido entregado. Reparación y ventas pendientes cobradas.'
              : 'Cobro registrado. El pendiente y rendimientos se actualizaron.',
          );
        });
      function earningsView() {
        const owner = shares(monthlySales(), 'Tefi'),
          repairThisMonth =
            state.repairPaid && state.repairDate.startsWith('2026-09-'),
          repairGain = repairThisMonth ? 14000 : 0,
          included = owner.total + repairGain,
          purchases = 17000;
        return `<div class="stack"><header class="earnings-hero"><div class="row between"><div><p>Finanzas de Tefi</p><h1 style="margin:5px 0">Rendimientos</h1><p>Septiembre de 2026</p></div><div><p>Resultado del mes</p><strong style="font-size:32px" class="money">${money(included - purchases)}</strong><p style="font-size:12px">Reparaciones + ventas de productos − compras de productos</p></div></div></header><div class="metrics"><section class="panel metric"><p>Ganancia de reparaciones</p><strong class="money" style="color:var(--green)">${money(repairGain)}</strong><small>Mano de obra + ganancia de repuestos cobrados.</small></section><section class="panel metric"><p>Compras de productos</p><strong class="money" style="color:var(--amber)">${money(purchases)}</strong><small>Compras de inventario pagadas por vos este mes.</small></section><section class="panel metric"><p>Tu parte en ventas de productos</p><strong class="money" style="color:var(--blue)">${money(owner.total)}</strong><small>Costo recuperado + tu ganancia, de ventas cobradas.</small></section></div><section class="panel"><div class="section-head"><h2>De dónde viene tu ganancia</h2></div><div class="chart"><div><div class="row between"><span>Reparaciones</span><strong class="money">${money(repairGain)}</strong></div><div class="bar amber"><span style="width:${repairGain ? Math.max(5, (repairGain / (owner.gain + repairGain)) * 100) : 0}%"></span></div></div><div><div class="row between"><span>Ventas de productos</span><strong class="money">${money(owner.gain)}</strong></div><div class="bar"><span style="width:${owner.gain ? Math.max(5, (owner.gain / (owner.gain + repairGain)) * 100) : 0}%"></span></div><small>Incluye ventas directas y productos cobrados con pedidos.</small></div></div></section>${distribution(monthlySales())}<section class="panel"><div class="section-head"><h2>Operaciones cobradas</h2></div><div class="table-wrap"><table><thead><tr><th>Concepto</th><th>Fecha del cobro</th><th class="right">En tus rendimientos</th></tr></thead><tbody>${repairThisMonth ? `<tr><td><button class="link" onclick="navigate('order')">Reparación · Pedido PE576GD</button><small>Mano de obra ${money(10000)} + ganancia de repuesto ${money(4000)}</small></td><td>${date(state.repairDate)}</td><td class="right money">${money(repairGain)}</td></tr>` : ''}${monthlySales()
          .map(
            (s) =>
              `<tr><td><button class="link" onclick="openSale(${s.id},'earnings')">Productos · Venta V${s.id}</button><small>${s.order ? 'Pedido PE576GD' : 'Venta directa'}</small></td><td>${date(s.paidDate)}</td><td class="right money">${money(shares([s], 'Tefi').total)}</td></tr>`,
          )
          .join(
            '',
          )}</tbody></table></div></section><p class="muted" style="font-size:12px">El repuesto costó $16.000: su compra se conserva en el pedido y no se resta en rendimientos. Al cobrar la reparación de $30.000, acá se incluyen $14.000. Las compras de productos del titular ($17.000) se siguen restando.</p></div>`;
      }
      function render() {
        document
          .getElementById('app')
          .classList.toggle('order-content', view === 'order');
        const names = {
          order: 'Pedidos › PE576GD',
          orders: 'Pedidos',
          sales: 'Ventas',
          detail: `Ventas › V${selectedSale}`,
          new: draft?.order
            ? 'Pedidos › PE576GD › Agregar productos'
            : 'Ventas › Nueva venta',
          earnings: 'Rendimientos',
        };
        document.getElementById('breadcrumb').textContent = names[view];
        document.getElementById('theme-button').innerHTML = icon('sun');
        const active = ['order', 'orders'].includes(view)
          ? 'orders'
          : view === 'earnings'
            ? 'earnings'
            : 'sales';
        for (const b of document.querySelectorAll('[data-nav]')) {
          const k = b.dataset.nav;
          b.classList.toggle('active', k === active);
          b.setAttribute('aria-current', k === active ? 'page' : 'false');
          b.innerHTML =
            icon(k === 'orders' ? 'order' : k === 'sales' ? 'sale' : 'chart') +
            { orders: 'Pedidos', sales: 'Ventas', earnings: 'Rendimientos' }[k];
        }
        document.getElementById('catalog-nav').innerHTML =
          icon('box') + 'Productos';
        document.getElementById('customers-nav').innerHTML =
          icon('user') + 'Clientes';
        document.getElementById('app').innerHTML = {
          order: orderView,
          orders: ordersView,
          sales: salesView,
          detail: detailView,
          new: newView,
          earnings: earningsView,
        }[view]();
        if (view === 'new') renderDraft();
      }
      resetDemo();
    </script>
  </body>
</html>
